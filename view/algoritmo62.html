<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const dias = Number(prompt("Quantos dias de viagem?"))
        const horas = Number(prompt("Quantas horas "))
        const total = ((dias*24) + horas)
        alert (`A viagem teve: ${dias} dias e ${horas} horas, total de horas = ${total}`)
    </script>
</body>
</html>
